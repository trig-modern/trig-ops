<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Trig Delivery — Receiving &amp; Routes</title>
<style>
  :root{
    --orange:#f4691c; --orange-deep:#E0512F; --blue:#30508c;
    --ink:#1c1b1a; --muted:#6b6763; --line:#e7e3de; --bg:#faf8f5; --card:#ffffff;
    --done:#2f8f6b; --now:#f4691c; --todo:#d9d4cd; --red:#c0392b; --amber:#b8860b;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer}

  /* Login */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:36px;max-width:400px;width:100%;text-align:center}
  .brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
  .brand span{color:var(--orange)}
  .login-card p{color:var(--muted);font-size:14px;line-height:1.5;margin:8px 0 24px}
  .field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;margin-bottom:12px}
  .field:focus{outline:none;border-color:var(--blue)}
  .btn{background:var(--orange);color:#fff;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:600;width:100%;transition:filter .15s}
  .btn:hover{filter:brightness(.96)}
  .btn:disabled{opacity:.5;cursor:default}
  .note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}

  /* Shell */
  header.topbar{position:sticky;top:0;z-index:10;background:rgba(250,248,245,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px}
  .topbar .brand{font-size:17px}
  .spacer{flex:1}
  .who{font-size:12px;color:var(--muted)}
  .ghost{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
  .tabs{display:flex;gap:6px;padding:12px 18px 0;position:sticky;top:57px;background:var(--bg);z-index:9}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px 999px 0 0;padding:10px 18px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:none}
  .tab[aria-selected="true"]{color:var(--orange);box-shadow:inset 0 -3px 0 var(--orange)}
  .tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;font-size:11px;background:var(--orange);color:#fff;border-radius:999px;font-weight:800}
  main{padding:16px 18px 60px;max-width:900px;margin:0 auto}
  .sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 2px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
  .sec-h:first-child{margin-top:4px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px;box-shadow:var(--shadow)}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .title{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f1ede8;color:var(--muted);white-space:nowrap}
  .pill.blue{background:rgba(48,80,140,.12);color:var(--blue)}
  .pill.orange{background:rgba(244,105,28,.14);color:var(--orange-deep)}
  .pill.green{background:rgba(47,143,107,.14);color:var(--done)}
  .pill.red{background:rgba(192,57,43,.12);color:var(--red)}
  .pill.amber{background:rgba(184,134,11,.14);color:var(--amber)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .mini{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
  .mini:hover{border-color:var(--orange);color:var(--orange-deep)}
  .mini.go{background:var(--done);border-color:var(--done);color:#fff}
  .mini.warn{background:var(--red);border-color:var(--red);color:#fff}
  .mini.blue{background:var(--blue);border-color:var(--blue);color:#fff}
  .empty{color:var(--muted);font-size:13.5px;padding:14px 4px}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .formgrid .full{grid-column:1/-1}
  .in{border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:14px;font-family:inherit;width:100%}
  .in:focus{outline:none;border-color:var(--blue)}
  label.lab{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block;margin:2px 2px 4px}
  .progress{height:6px;border-radius:3px;background:var(--todo);overflow:hidden;margin-top:8px}
  .progress > i{display:block;height:100%;background:var(--done)}
  .stop{border-top:1px solid var(--line);padding:11px 0}
  .stop:first-of-type{border-top:none}
  .seqdot{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle}
  .stop.delivered .title{text-decoration:line-through;color:var(--muted)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .taskdone .title{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand">Trig <span>Delivery</span></div>
    <p>Receiving &amp; delivery routes. Sign in with your Trig email.</p>
    <form id="loginForm" autocomplete="on">
      <input id="email" class="field" type="email" placeholder="you@trigmodern.com" autocomplete="username" />
      <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="signIn" class="btn" type="submit">Sign in</button>
    </form>
    <div id="loginMsg" class="note"></div>
    <div class="note"><a href="#" id="magicLink">First time or forgot your password? Email me a sign-in link →</a></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">Trig <span>Delivery</span></div>
    <div class="spacer"></div>
    <span id="who" class="who"></span>
    <button id="setPw" class="ghost">Set password</button>
    <button id="refresh" class="ghost">↻</button>
    <button id="signout" class="ghost">Sign out</button>
  </header>
  <nav class="tabs">
    <button class="tab" data-tab="receiving" aria-selected="true">Receiving</button>
    <button class="tab" data-tab="routes" aria-selected="false">Routes</button>
    <button class="tab" data-tab="tasks" aria-selected="false">My Tasks <span id="taskBadge" class="badge hidden">0</span></button>
  </nav>
  <main>
    <section id="tab-receiving">
      <div class="sec-h">Arriving / in transit</div>
      <div id="inbound"></div>
      <div class="sec-h">Check in an item</div>
      <div class="card">
        <div class="formgrid">
          <div><label class="lab">SKU / Item #</label><input id="m_sku" class="in" placeholder="optional"></div>
          <div><label class="lab">Vendor</label><input id="m_vendor" class="in" placeholder="e.g. Four Hands"></div>
          <div class="full"><label class="lab">Description</label><input id="m_desc" class="in" placeholder="what arrived"></div>
          <div><label class="lab">Qty</label><input id="m_qty" class="in" type="number" value="1" min="1"></div>
          <div><label class="lab">Order / Client</label><input id="m_ref" class="in" placeholder="optional"></div>
          <div><label class="lab">Condition</label>
            <select id="m_cond" class="in"><option value="good">Good</option><option value="damaged">Damaged</option><option value="partial">Partial</option></select>
          </div>
          <div><label class="lab">Notes</label><input id="m_notes" class="in" placeholder="optional"></div>
        </div>
        <div class="acts"><button id="m_checkin" class="mini go">✓ Check in item</button></div>
      </div>
      <div class="sec-h">Received today</div>
      <div id="received"></div>
    </section>

    <section id="tab-routes" class="hidden">
      <div class="sec-h">Delivery routes</div>
      <div id="routes"></div>
    </section>

    <section id="tab-tasks" class="hidden">
      <div class="sec-h">Tasks for me</div>
      <div id="tasks"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://xyfogedlowneaevmjkci.supabase.co';
const SUPABASE_ANON = 'sb_publishable_ae3zGuAafiURw0AsjwXkvQ_amrQDJUu';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const TRIG_DOMAIN = '@trigmodern.com';

const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = { email:null, tab:'receiving' };

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------- auth ----------
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  session ? showApp(session.user.email) : showLogin();
  sb.auth.onAuthStateChange((_e,s)=> s ? showApp(s.user.email) : showLogin());
}
function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
const emailVal = ()=> $('#email').value.trim().toLowerCase();
$('#loginForm').onsubmit = async (e)=>{
  e.preventDefault();
  const email = emailVal(), password = $('#password').value;
  if(!email.endsWith(TRIG_DOMAIN)){ $('#loginMsg').textContent='Use your @trigmodern.com email.'; return; }
  if(!password){ $('#loginMsg').textContent='Enter your password — or use the email-link option below the first time.'; return; }
  $('#signIn').disabled=true; $('#loginMsg').textContent='Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('#signIn').disabled=false;
  if(error) $('#loginMsg').textContent = /invalid/i.test(error.message)
    ? 'Wrong email or password. First time? Use the email-link below, then set a password.'
    : ('Error: '+error.message);
};
$('#magicLink').onclick = async (e)=>{
  e.preventDefault();
  const email = emailVal();
  if(!email.endsWith(TRIG_DOMAIN)){ $('#loginMsg').textContent='Enter your @trigmodern.com email first.'; return; }
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.href.split('#')[0] }});
  $('#loginMsg').textContent = error ? ('Error: '+error.message)
    : "Check your inbox — tap the link and you'll land here signed in. Then hit “Set password” so next time you just type it.";
};
$('#setPw').onclick = async ()=>{
  const pw = prompt('Set a password for '+state.email+' (min 6 chars). Next time, just sign in with your email + this password.');
  if(pw===null) return;
  if(pw.length<6){ toast('Too short — min 6 characters'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  toast(error ? ('Error: '+error.message) : 'Password set ✓ — use it next time');
};
$('#signout').onclick = ()=> sb.auth.signOut();
$('#refresh').onclick = ()=> loadAll();

async function showApp(email){
  email = (email||'').toLowerCase();
  if(!email.endsWith(TRIG_DOMAIN)){
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
    $('#loginMsg').textContent = `${email} isn't a Trig email. Sign in with your @trigmodern.com address.`;
    await sb.auth.signOut(); return;
  }
  state.email = email;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = email;
  loadAll();
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>{
  state.tab = t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=> x.setAttribute('aria-selected', x===t));
  ['receiving','routes','tasks'].forEach(k=> $('#tab-'+k).classList.toggle('hidden', k!==state.tab));
});

function loadAll(){ loadReceiving(); loadRoutes(); loadTasks(); }

// ---------- receiving ----------
async function loadReceiving(){
  // inbound = paid Square order lines not yet checked in (view self-excludes received lines)
  const { data:inbound } = await sb.from('v_incoming_receiving').select('*').limit(80);
  const el = $('#inbound');
  if(!inbound || !inbound.length){ el.innerHTML = '<div class="empty">Nothing arriving right now. Check items in manually below as they arrive.</div>'; }
  else el.innerHTML = inbound.map(r=>`
    <div class="card">
      <div class="row">
        <div style="display:flex;gap:10px;align-items:flex-start">
          ${r.product_image?`<img src="${esc(r.product_image)}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:#eee">`:''}
          <div>
            <div class="title">${esc(r.description||r.catalog_model||r.sku||'Item')} ${r.qty>1?`<span class="pill">×${r.qty}</span>`:''}</div>
            <div class="sub">${esc([r.client_name&&('for '+r.client_name),r.sku&&('SKU '+r.sku),r.ordered_at&&('ordered '+new Date(r.ordered_at).toLocaleDateString([], {month:'short',day:'numeric'}))].filter(Boolean).join(' · '))}</div>
          </div>
        </div>
        <span class="pill blue">paid</span>
      </div>
      <div class="acts">
        <button class="mini go" data-in="${r.line_id}">✓ Receive</button>
        <button class="mini warn" data-dmg="${r.line_id}">Receive — damaged</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-in]').forEach(b=> b.onclick=()=>receiveLine(inbound.find(x=>x.line_id==b.dataset.in),'good'));
  el.querySelectorAll('[data-dmg]').forEach(b=> b.onclick=()=>receiveLine(inbound.find(x=>x.line_id==b.dataset.dmg),'damaged'));

  // received today
  const start = new Date(); start.setHours(0,0,0,0);
  const { data:today } = await sb.from('ops_receiving').select('*').gte('received_at',start.toISOString()).order('received_at',{ascending:false});
  const rel = $('#received');
  if(!today || !today.length){ rel.innerHTML = '<div class="empty">Nothing checked in yet today.</div>'; }
  else rel.innerHTML = today.map(r=>`
    <div class="card"><div class="row">
      <div><div class="title">${esc(r.description||r.sku||'Item')} ${r.qty>1?`<span class="pill">×${r.qty}</span>`:''}</div>
        <div class="sub">${esc([r.vendor,r.sku&&('SKU '+r.sku),r.order_ref&&('#'+r.order_ref),r.notes].filter(Boolean).join(' · '))}</div>
        <div class="sub">by ${esc((r.received_by||'').split('@')[0])} · ${new Date(r.received_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div></div>
      <span class="pill ${r.condition==='good'?'green':(r.condition==='damaged'?'red':'amber')}">${esc(r.condition)}</span>
    </div></div>`).join('');
}
async function receiveLine(r, condition){
  if(!r) return;
  const { error } = await sb.from('ops_receiving').insert({
    received_by:state.email, source:'auto', condition,
    sales_order_line_id:r.line_id, app_id:r.app_id,
    sku:r.sku, description:r.description||r.catalog_model, qty:r.qty||1,
    client:r.client_name, order_ref:r.square_order_id
  });
  if(error){ toast('Error: '+error.message); return; }
  toast(condition==='damaged'?'Received (flagged damaged)':'Received ✓'); loadReceiving();
}
$('#m_checkin').onclick = async ()=>{
  const desc=$('#m_desc').value.trim(), sku=$('#m_sku').value.trim();
  if(!desc && !sku){ toast('Add a description or SKU'); return; }
  const { error } = await sb.from('ops_receiving').insert({
    received_by:state.email, source:'manual',
    sku, description:desc, vendor:$('#m_vendor').value.trim(),
    qty:parseInt($('#m_qty').value||'1',10), order_ref:$('#m_ref').value.trim(),
    condition:$('#m_cond').value, notes:$('#m_notes').value.trim()
  });
  if(error){ toast('Error: '+error.message); return; }
  ['m_sku','m_vendor','m_desc','m_ref','m_notes'].forEach(id=>$('#'+id).value=''); $('#m_qty').value='1'; $('#m_cond').value='good';
  toast('Checked in ✓'); loadReceiving();
};

// ---------- routes ----------
async function loadRoutes(){
  const today = new Date(); today.setHours(0,0,0,0);
  const { data:routes } = await sb.from('ops_delivery_routes').select('*')
    .gte('route_date', today.toISOString().slice(0,10)).order('route_date').order('id');
  const el = $('#routes');
  if(!routes || !routes.length){ el.innerHTML='<div class="empty">No routes scheduled. Ryan or Zach can build one — just ask Claude, e.g. "make a delivery route for Thursday: Speri 2–4, then the Chen console."</div>'; return; }
  const ids = routes.map(r=>r.id);
  const { data:stops } = await sb.from('ops_route_stops').select('*').in('route_id',ids).order('seq');
  const byRoute = {}; (stops||[]).forEach(s=> (byRoute[s.route_id]=byRoute[s.route_id]||[]).push(s));
  el.innerHTML = routes.map(r=>{
    const ss = byRoute[r.id]||[];
    const del = ss.filter(s=>s.status==='delivered').length;
    const pct = ss.length? Math.round(del/ss.length*100):0;
    const d = new Date(r.route_date+'T00:00:00');
    const dstr = d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
    return `<div class="card">
      <div class="row">
        <div><div class="title">${esc(r.name||'Route')} <span class="pill blue">${esc(dstr)}</span></div>
          <div class="sub">${esc([r.driver&&('Driver '+r.driver),r.truck&&('Truck '+r.truck),`${del}/${ss.length} delivered`].filter(Boolean).join(' · '))}</div></div>
        <span class="pill ${r.status==='done'?'green':(r.status==='out'?'orange':'')}">${esc(r.status)}</span>
      </div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      ${ss.map(s=>`
        <div class="stop ${s.status==='delivered'?'delivered':''}">
          <div class="row">
            <div><div class="title"><span class="seqdot">${s.seq}</span>${esc(s.client||'Stop')}</div>
              <div class="sub">${esc([s.address,(s.window_start&&(s.window_start+(s.window_end?'–'+s.window_end:''))),s.items,s.order_ref&&('#'+s.order_ref),s.phone].filter(Boolean).join(' · '))}</div>
              ${s.notes?`<div class="sub">📝 ${esc(s.notes)}</div>`:''}</div>
            <span class="pill ${s.status==='delivered'?'green':(s.status==='failed'?'red':(s.status==='loaded'?'amber':''))}">${esc(s.status)}</span>
          </div>
          <div class="acts">
            <button class="mini" data-stop="${s.id}" data-st="loaded">Loaded</button>
            <button class="mini go" data-stop="${s.id}" data-st="delivered">✓ Delivered</button>
            <button class="mini warn" data-stop="${s.id}" data-st="failed">Failed</button>
          </div>
        </div>`).join('')}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-stop]').forEach(b=> b.onclick=()=>updateStop(b.dataset.stop, b.dataset.st));
}
async function updateStop(id, st){
  const patch = { status:st };
  if(st==='delivered'){ patch.delivered_at=new Date().toISOString(); patch.delivered_by=state.email; }
  const { error } = await sb.from('ops_route_stops').update(patch).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  toast(st==='delivered'?'Delivered ✓':('Marked '+st)); loadRoutes();
}

// ---------- tasks ----------
async function loadTasks(){
  const { data:tasks } = await sb.from('ops_delivery_tasks').select('*')
    .or(`assigned_to.eq.jeff,assigned_to.eq.all,assigned_to.eq.${state.email}`)
    .order('status').order('due_at',{ascending:true,nullsFirst:false}).limit(60);
  const open = (tasks||[]).filter(t=>t.status==='open');
  const b=$('#taskBadge'); if(open.length){ b.textContent=open.length; b.classList.remove('hidden'); } else b.classList.add('hidden');
  const el=$('#tasks');
  if(!tasks || !tasks.length){ el.innerHTML='<div class="empty">No tasks assigned. Ryan can add one via Claude — it lands here and on the shared calendar.</div>'; return; }
  el.innerHTML = tasks.map(t=>{
    const due = t.due_at? new Date(t.due_at):null;
    const overdue = due && t.status==='open' && due < new Date();
    return `<div class="card ${t.status==='done'?'taskdone':''}">
      <div class="row">
        <div><div class="title">${esc(t.title)}</div>
          ${t.detail?`<div class="sub">${esc(t.detail)}</div>`:''}
          <div class="sub">${t.assigned_by?('from '+esc(t.assigned_by.split('@')[0])+' · '):''}${due?`<span class="pill ${overdue?'red':'blue'}">${due.toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}${overdue?' · overdue':''}</span>`:''} ${t.cal_link?`<a href="${esc(t.cal_link)}" target="_blank" class="pill">📅 calendar</a>`:''}</div></div>
        <button class="mini ${t.status==='done'?'':'go'}" data-task="${t.id}" data-done="${t.status==='open'}">${t.status==='open'?'✓ Done':'Undo'}</button>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-task]').forEach(b=> b.onclick=()=>toggleTask(b.dataset.task, b.dataset.done==='true'));
}
async function toggleTask(id, markDone){
  const patch = markDone? { status:'done', done_at:new Date().toISOString() } : { status:'open', done_at:null };
  const { error } = await sb.from('ops_delivery_tasks').update(patch).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  toast(markDone?'Done ✓':'Reopened'); loadTasks();
}

// poll every 30s
setInterval(()=>{ if(state.email && !document.hidden) loadAll(); }, 30000);
